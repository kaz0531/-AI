<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C55">
<title>診察メモAI</title>
<style>
:root{
  --bg:#111615;--sf:#1B2220;--sub:#242E2B;--tx:#FFFFFF;--mu:#E6ECEA;--bd:#3E4F49;
  --pr:#2DD4BF;--pr-tx:#0B221F;--pl:#1B3B36;--dg:#FFB4B4;--dgb:#3A1F1F;--dgd:#8A4A4A;
  --chk-bg:#FFFFFF;--chk-bd:#CBD5D1;--chk-on:#38BDF8;--chk-tx:#FFFFFF;
  --nav-tx:#E6ECEA;
}
:root[data-theme="light"]{
  --bg:#F4F7F6;--sf:#FFFFFF;--sub:#EEF2F1;--tx:#111827;--mu:#1F2937;--bd:#CBD5D1;
  --pr:#0F5C55;--pr-tx:#FFFFFF;--pl:#E6F3F1;--dg:#7F1D1D;--dgb:#FFF5F5;--dgd:#E5989B;
  --chk-bg:#FFFFFF;--chk-bd:#94A3B8;--chk-on:#0EA5E9;--chk-tx:#FFFFFF;
  --nav-tx:#374151;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--sf)}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:20px;letter-spacing:.02em}
.tab-badge{font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pl);color:var(--pr)}
header p{margin:4px 0 0;font-size:15px;color:var(--mu)}
main{flex:1;padding:14px 14px 100px;display:flex;flex-direction:column;gap:12px}
main.has-action{padding-bottom:164px}
.lead-line{margin:0;font-size:15px;font-weight:600;color:var(--tx);background:var(--pl);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;line-height:1.45}
.flow-line{margin:0;font-size:14px;font-weight:700;color:var(--tx);background:var(--pl);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.sub{background:var(--sub);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
h2{margin:0;font-size:18px}
.mu{margin:0;font-size:16px;color:var(--mu);line-height:1.55}
.scale-guide{margin:0;font-size:11px;color:var(--mu);line-height:1.5;text-align:center}
.btn{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.on,.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--pr-tx)}
.btn.del{color:var(--dg);border-color:var(--dgd)}
.btn.del-sm{min-height:34px;padding:4px 10px;font-size:13px;border-radius:9px;flex:0 0 auto}
.btn.edit-btn{min-height:40px;padding:6px 14px;font-size:15px;flex:0 0 auto}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.hist-hd{display:flex;align-items:center;gap:8px}
.hist-date{flex:1;font-size:17px}
input,select,textarea{width:100%;max-width:100%;min-width:0;min-height:44px;padding:10px;font:16px inherit;font-family:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:block}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.65}
textarea{min-height:90px}
.date-wrap{position:relative;width:100%;max-width:100%}
.date-wrap input[type="date"]{width:100%;max-width:100%;min-width:0;padding-right:40px;appearance:none;-webkit-appearance:none}
.date-wrap input[type="date"]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;top:0;width:44px;height:100%;cursor:pointer;z-index:2}
.date-ph{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);opacity:.6;pointer-events:none;font-size:16px}
.date-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mu);display:flex;align-items:center}
.chk-item{flex-direction:row;align-items:flex-start;gap:12px;cursor:pointer}
.chk-box{appearance:none;-webkit-appearance:none;width:26px;min-width:26px;height:26px;min-height:26px;margin:2px 0 0;padding:0;border-radius:7px;border:2px solid var(--chk-bd);background:var(--chk-bg);position:relative;cursor:pointer;flex:0 0 26px}
.chk-box:checked{background:var(--chk-on);border-color:var(--chk-on)}
.chk-box:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--chk-tx);font-size:17px;font-weight:800;line-height:1}
.rep-big{background:var(--sub);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rep-big-label{font-size:14px;font-weight:700;color:var(--pr)}
.rep-big-val{font-size:18px;font-weight:700;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.avg-box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.avg-name{font-size:13px;color:var(--mu);margin-bottom:4px;line-height:1.3}
.avg-num{font-size:22px;font-weight:800;color:var(--tx)}
.sticky-action{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:8;display:flex;justify-content:center;padding:8px 14px;background:var(--bg);border-top:1px solid var(--bd)}
.sticky-action button{width:100%;max-width:492px;min-height:52px;font-size:18px;font-weight:800;border-radius:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px;padding:4px}
nav button{min-height:48px;border:0;background:none;color:var(--nav-tx);font:600 15px inherit;font-family:inherit;border-radius:10px;cursor:pointer}
nav button.on{background:var(--pl);color:var(--pr);font-weight:800}
.danger{background:var(--dgb);border:2px solid var(--dgd);border-radius:14px;padding:14px;color:var(--tx)}
.danger a{color:var(--dg);font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;font:15px/1.7 inherit;font-family:inherit;margin:0}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#0F172A;color:#FFFFFF;border:1px solid #475569;padding:10px 18px;border-radius:99px;font-size:16px;font-weight:700;z-index:20;white-space:nowrap}
.hidden{display:none}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hd-top"><h1>診察メモAI</h1><span id="ht" class="tab-badge">記録</span></div>
  <p>診断の代わりではありません。記録だけのアプリです。</p>
</header>
<main id="main"></main>
</div>
<div id="sticky-wrap" class="sticky-action hidden"></div>
<div id="toast" class="hidden"></div>
<nav><div id="nav"></div></nav>
<script>
const KEY='shinsatsu-memo-v2';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fmt=s=>{const p=s.split('-');return `${+p[1]}/${+p[2]}`};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num=v=>typeof v==='number'&&isFinite(v);
const today=()=>ymd(new Date());

let data={records:{},chief:'',questions:'',lastVisit:'',share:{},theme:'dark'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)data=Object.assign(data,s)}catch(e){}
function applyTheme(){
  const t=data.theme==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',t==='light'?'#0F5C55':'#111615');
}
applyTheme();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('保存できませんでした（プライベートモードの可能性）')}}

const FIELDS=[['distress','全体的なつらさ'],['anxiety','不安の強さ'],['mood','気分の落ち込み'],['stomach','胃の不快感']];
const blank=()=>({distress:null,anxiety:null,mood:null,stomach:null,loop:null,sleep:null,med:null,note:''});
let tab='rec',cur=today(),draft=blank(),crisis=false,repDetail=false;
loadDraft();

function loadDraft(){draft=Object.assign(blank(),data.records[cur]||{})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.add('hidden'),2500)}
function go(t){tab=t;render();window.scrollTo(0,0)}

function render(){
  const titles={rec:'記録する',hist:'履歴',rep:'診察前レポート',set:'設定'};
  document.getElementById('ht').textContent=titles[tab];
  document.getElementById('nav').innerHTML=[['rec','記録'],['hist','履歴'],['rep','レポート'],['set','設定']]
    .map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const mainEl=document.getElementById('main');
  const stickyEl=document.getElementById('sticky-wrap');
  mainEl.innerHTML={rec:vRec,hist:vHist,rep:vRep,set:vSet}[tab]();
  if(tab==='rec'){
    mainEl.classList.add('has-action');
    stickyEl.classList.remove('hidden');
    stickyEl.innerHTML=`<button class="btn pri" onclick="saveRec()">保存する</button>`;
  }else if(tab==='rep'){
    mainEl.classList.add('has-action');
    stickyEl.classList.remove('hidden');
    stickyEl.innerHTML=`<button class="btn pri" onclick="copyRep()">今すぐコピー</button>`;
  }else{
    mainEl.classList.remove('has-action');
    stickyEl.classList.add('hidden');
    stickyEl.innerHTML='';
  }
}

/* ---------- 記録 ---------- */
function vRec(){
  const exists=!!data.records[cur];
  return `
  <p class="lead-line">今日の体調を記録して、診察で先生に見せるメモを作ります</p>
  ${crisis?crisisBox():''}
  <section class="card">
    <label class="mu" for="d">記録する日</label>
    <div class="date-wrap">
      <input id="d" type="date" max="${today()}" value="${cur}" onchange="changeDate(this.value)">
      <span class="date-ico" aria-hidden="true">${calSvg()}</span>
    </div>
    <p class="mu">${exists?'この日は記録済みです（上書き保存されます）':'この日はまだ記録がありません'}。書ける項目だけで大丈夫です。未選択は「未入力」として扱われ、0（なし）とは区別されます。</p>
    ${FIELDS.map(([k,l])=>`
      <div class="sub">
        <div class="row"><b>${l}</b><span class="mu" style="text-align:right">${num(draft[k])?draft[k]+' / 4':'未入力'}</span></div>
        <div class="g5">${[0,1,2,3,4].map(n=>`<button class="btn ${draft[k]===n?'on':''}" onclick="setScale('${k}',${n})">${n}</button>`).join('')}</div>
        <p class="scale-guide">0 なし ／ 1 少し ／ 2 まあまあ<br>3 つらい ／ 4 とてもつらい</p>
      </div>`).join('')}
    <p class="mu">もう一度同じ数字を押すと「未入力」に戻ります。</p>
    <label class="mu" for="lp">思考ループ（同じ考えが頭を回る）</label>
    <select id="lp" onchange="draft.loop=this.value===''?null:this.value==='1'">
      <option value="" ${draft.loop===null?'selected':''}>未入力</option>
      <option value="1" ${draft.loop===true?'selected':''}>あり</option>
      <option value="0" ${draft.loop===false?'selected':''}>なし</option></select>
    <label class="mu" for="sl">睡眠時間（時間）</label>
    <input id="sl" type="number" inputmode="decimal" step="0.5" min="0" max="24" placeholder="例：6.5" value="${num(draft.sleep)?draft.sleep:''}" oninput="const v=parseFloat(this.value);draft.sleep=isNaN(v)?null:v">
    <label class="mu" for="md">服薬</label>
    <select id="md" onchange="draft.med=this.value||null">
      ${['','飲めた','飲み忘れた','対象外・なし'].map(o=>`<option value="${o}" ${(draft.med||'')===o?'selected':''}>${o||'未入力'}</option>`).join('')}</select>
    <label class="mu" for="nt">自由メモ（原文のまま保存）</label>
    <textarea id="nt" placeholder="気になったこと、先生に伝えたいこと" oninput="draft.note=this.value">${esc(draft.note)}</textarea>
  </section>
  <details class="card"><summary><b>つらいときの相談先</b></summary>${crisisBody()}</details>`;
}
function calSvg(){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`}
function crisisBody(){return `<p class="mu">命の危険を感じるときは <a href="tel:119">119</a>（救急）や <a href="tel:110">110</a>。通院先にも連絡してください。</p>
<p class="mu">#いのちSOS <a href="tel:0120061338">0120-061-338</a><br>よりそいホットライン <a href="tel:0120279338">0120-279-338</a><br>受付時間などは厚生労働省「まもろうよ こころ」で最新情報をご確認ください。</p>`}
function crisisBox(){return `<section class="danger" role="alert"><b>つらい気持ちが書かれていました。</b><p style="margin:6px 0">ひとりで抱えず、誰かに話してください。このアプリは緊急対応を行えません。</p>${crisisBody()}</section>`}
function changeDate(v){if(!v)return;cur=v;loadDraft();crisis=false;render()}
function setScale(k,n){draft[k]=draft[k]===n?null:n;render()}
function saveRec(){
  const empty=FIELDS.every(([k])=>!num(draft[k]))&&draft.loop===null&&!num(draft.sleep)&&!draft.med&&!draft.note.trim();
  if(empty){toast('何も入力されていません');return}
  data.records[cur]=Object.assign({},draft,{note:draft.note.trim()});
  persist();
  crisis=/死にたい|消えたい|消えてしまいたい|いなくなりたい|自殺/.test(draft.note);
  toast('保存しました');
  if(crisis){render();window.scrollTo(0,0)}else{cur=today();loadDraft();go('hist')}
}

/* ---------- 履歴 ---------- */
function vHist(){
  const ds=Object.keys(data.records).sort().reverse();
  if(!ds.length)return `<section class="card"><h2>まだ記録がありません</h2><p class="mu">「記録」タブから、今日の分を入力してみましょう。</p><button class="btn pri" onclick="go('rec')">今日の記録をつける</button></section>`;
  return `<p class="mu">記録 ${ds.length}日分</p>`+ds.map(d=>{const r=data.records[d];
    const v=x=>num(x)?x:'−';
    return `<section class="card"><div class="hist-hd"><b class="hist-date">${d.replace(/-/g,'/')}</b>
      <button class="btn edit-btn" onclick="editRec('${d}')">編集</button><button class="btn del del-sm" onclick="delRec('${d}')">削除</button></div>
      <p class="mu">全体的なつらさ ${v(r.distress)}／不安 ${v(r.anxiety)}／気分 ${v(r.mood)}／胃 ${v(r.stomach)}／睡眠 ${num(r.sleep)?r.sleep+'h':'−'}／薬 ${r.med||'−'}</p>
      ${r.note?`<p style="margin:0;font-size:16px">「${esc(r.note)}」</p>`:''}</section>`}).join('');
}
function editRec(d){cur=d;loadDraft();crisis=false;go('rec')}
function delRec(d){if(!confirm('本当に消しますか？'))return;delete data.records[d];delete data.share[d];persist();render()}

/* ---------- レポート ---------- */
function period(){
  const t=today();let from=addDays(t,-13);
  if(data.lastVisit&&data.lastVisit<t&&diff(data.lastVisit,t)<=180)from=addDays(data.lastVisit,1);
  return {from,to:t,n:diff(from,t)+1};
}
function stat(list,k){const v=list.map(r=>r[k]).filter(num);if(!v.length)return{avg:null,n:0,min:null,max:null};
  const s=v.reduce((a,b)=>a+b,0);return{avg:+(s/v.length).toFixed(1),n:v.length,min:Math.min(...v),max:Math.max(...v)}}
function reportText(){
  const p=period();
  const recs=Object.keys(data.records).filter(d=>d>=p.from&&d<=p.to).sort().map(d=>Object.assign({d},data.records[d]));
  const line=(l,s,u,mx)=>s.n?`・${l}：平均 ${s.avg}${u}${mx?'/4':''}（${s.n}日分、範囲 ${s.min}〜${s.max}）`:`・${l}：記録なし`;
  const mid=addDays(p.from,Math.floor(p.n/2));
  const h1=recs.filter(r=>r.d<mid),h2=recs.filter(r=>r.d>=mid);
  const half=k=>{const a=stat(h1,k),b=stat(h2,k);
    return `${a.n?a.avg+'（'+a.n+'日分）':'記録なし'} → ${b.n?b.avg+'（'+b.n+'日分）':'記録なし'}`};
  const loopA=recs.filter(r=>typeof r.loop==='boolean'),loopY=loopA.filter(r=>r.loop);
  const medA=recs.filter(r=>r.med),taken=medA.filter(r=>r.med==='飲めた'),missed=medA.filter(r=>r.med==='飲み忘れた');
  const none=[];
  FIELDS.forEach(([k,l])=>{if(!stat(recs,k).n)none.push(l)});
  if(!stat(recs,'sleep').n)none.push('睡眠時間');if(!loopA.length)none.push('思考ループ');if(!medA.length)none.push('服薬');
  const notes=recs.filter(r=>r.note&&data.share[r.d]);
  return [
`【診察前メモ】${fmt(p.from)}〜${fmt(p.to)}（${p.n}日間・記録${recs.length}日／未記録${p.n-recs.length}日）`,
`※本人の記録を未入力除外で集計。診断や薬の効果の判断ではありません。`,
``,`■今回一番伝えたいこと`,data.chief.trim()||'（未記入）',
``,`■症状の平均（0〜4）`,...FIELDS.map(([k,l])=>line(l,stat(recs,k),'',true)),
`・前半→後半の不安（${fmt(p.from)}〜${fmt(addDays(mid,-1))} → ${fmt(mid)}〜${fmt(p.to)}）：${half('anxiety')}`,
`・思考ループ：${loopA.length?`「あり」${loopY.length}日（回答${loopA.length}日分）`:'記録なし'}`,
``,`■睡眠`,line('睡眠時間',stat(recs,'sleep'),'時間'),`・前半→後半：${half('sleep')}`,
``,`■服薬`,medA.length?`・飲めた${taken.length}日／飲み忘れ${missed.length}日（回答${medA.length}日分）`:'・記録なし',
...(missed.length?[`・飲み忘れ日：${missed.map(r=>fmt(r.d)).join('、')}`]:[]),
``,`■本人メモ（共有を選んだもの）`,...(notes.length?notes.map(r=>`・${fmt(r.d)}「${r.note}」`):['・なし']),
``,`■医師に質問したいこと`,data.questions.trim()||'（未記入）',
``,`■期間中に記録がなかった項目`,none.length?none.join('、'):'なし'
  ].join('\n');
}
function repSummaryHtml(){
  const p=period();
  const recs=Object.keys(data.records).filter(d=>d>=p.from&&d<=p.to).sort().map(d=>Object.assign({d},data.records[d]));
  const sD=stat(recs,'distress'),sA=stat(recs,'anxiety'),sM=stat(recs,'mood');
  const av=s=>s.n?`${s.avg}<span style="font-size:13px;font-weight:600"> / 4</span>`:'−';
  return `
  <div class="rep-big">
    <span class="rep-big-label">一番伝えたいこと</span>
    <div class="rep-big-val">${esc(data.chief.trim()||'（未記入）')}</div>
  </div>
  <div class="rep-big">
    <span class="rep-big-label">医師に質問したいこと</span>
    <div class="rep-big-val">${esc(data.questions.trim()||'（未記入）')}</div>
  </div>
  <div class="rep-big">
    <span class="rep-big-label">全体的なつらさ・不安・気分の平均（${fmt(p.from)}〜${fmt(p.to)}）</span>
    <div class="avg-grid">
      <div class="avg-box"><div class="avg-name">全体的な<br>つらさ</div><div class="avg-num">${av(sD)}</div></div>
      <div class="avg-box"><div class="avg-name">不安の<br>強さ</div><div class="avg-num">${av(sA)}</div></div>
      <div class="avg-box"><div class="avg-name">気分の<br>落ち込み</div><div class="avg-num">${av(sM)}</div></div>
    </div>
  </div>`;
}
function vRep(){
  const p=period();
  const recs=Object.keys(data.records).filter(d=>d>=p.from&&d<=p.to).sort();
  const withNote=recs.filter(d=>data.records[d].note);
  return `
  <p class="flow-line">① メモを選ぶ → ② 内容を見る → ③ コピーする</p>
  <section class="card">
    <p class="mu">対象期間：${fmt(p.from)}〜${fmt(p.to)}${data.lastVisit?'（前回受診日の翌日から）':'（直近14日。設定で前回受診日を入れると変わります）'}</p>
    <label for="ch"><b>今回一番伝えたいこと</b></label>
    <textarea id="ch" placeholder="ここを押して書いてください" oninput="data.chief=this.value;persist();upd()">${esc(data.chief)}</textarea>
    <label for="qs"><b>医師に質問したいこと</b></label>
    <textarea id="qs" placeholder="聞きたいことがあれば書いてください" oninput="data.questions=this.value;persist();upd()">${esc(data.questions)}</textarea>
  </section>
  ${withNote.length?`<section class="card"><b>医師に見せるメモを選ぶ</b>${withNote.map(d=>`
    <label class="sub chk-item"><input type="checkbox" class="chk-box" ${data.share[d]?'checked':''} onchange="data.share['${d}']=this.checked;persist();upd()"><span><b>${fmt(d)}</b><br>${esc(data.records[d].note)}</span></label>`).join('')}</section>`:''}
  <section class="card">
    <h2>診察で見せる内容</h2>
    <div id="rep-sum">${repSummaryHtml()}</div>
    <button class="btn" id="rep-toggle" onclick="toggleRepDetail()">${repDetail?'詳細を閉じる':'詳しく見る'}</button>
    <pre id="rt" class="${repDetail?'':'hidden'}">${esc(reportText())}</pre>
  </section>`;
}
function toggleRepDetail(){
  repDetail=!repDetail;
  const rt=document.getElementById('rt');
  const btn=document.getElementById('rep-toggle');
  if(rt)rt.classList.toggle('hidden',!repDetail);
  if(btn)btn.textContent=repDetail?'詳細を閉じる':'詳しく見る';
}
function upd(){
  const sum=document.getElementById('rep-sum');
  if(sum)sum.innerHTML=repSummaryHtml();
  const e=document.getElementById('rt');
  if(e)e.textContent=reportText();
}
function copyRep(){
  const t=reportText();
  const done=()=>toast('コピーしました');
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,fb);else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('コピーできませんでした')}a.remove()}
}

/* ---------- 設定 ---------- */
function vSet(){return `
  <section class="card"><h2>画面の明るさ</h2>
    <p class="mu">見やすい表示を選べます。</p>
    <div class="row">
      <button class="btn ${data.theme!=='light'?'on':''}" onclick="setTheme('dark')">暗い画面（白文字）</button>
      <button class="btn ${data.theme==='light'?'on':''}" onclick="setTheme('light')">明るい画面（白背景）</button>
    </div>
  </section>
  <section class="card"><h2>前回の受診日</h2>
    <p class="mu">入れると、レポートの期間が「前回受診日の翌日〜今日」になります。</p>
    <div class="date-wrap">
      <input id="lv" type="date" max="${today()}" value="${data.lastVisit||''}" aria-label="前回の受診日" onchange="data.lastVisit=this.value;persist();toast('保存しました');render()">
      ${data.lastVisit?'':`<span class="date-ph">例：2026/11/04</span>`}
      <span class="date-ico" aria-hidden="true">${calSvg()}</span>
    </div>
  </section>
  <section class="card"><h2>このアプリについて</h2>
    <p class="mu">このアプリは診断・治療の助言を行うものではなく、本人の記録整理用です。記録されたデータはこの端末のブラウザ内にのみ保存され、外部には送信されません。</p>
  </section>
  <section class="card"><h2>バックアップ</h2>
    <p class="mu">データはこのブラウザ内だけにあります。ブラウザの履歴削除や機種変更で消えるため、ときどき書き出してください。</p>
    <button class="btn" onclick="exportData()">データを書き出す</button>
    <label class="btn" style="display:flex;align-items:center;justify-content:center">データを読み込む<input type="file" accept="application/json" class="hidden" onchange="importData(this.files[0])"></label></section>
  <section class="card"><h2>すべて削除</h2><button class="btn del" onclick="wipe()">全データを削除する</button></section>
  <details class="card"><summary><b>つらいときの相談先</b></summary>${crisisBody()}</details>`}
function setTheme(t){
  data.theme=t;
  applyTheme();
  persist();
  render();
  toast(t==='light'?'明るい画面にしました':'暗い画面にしました');
}
function exportData(){
  const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`shinsatsu-memo-${today()}.json`;a.click();
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||typeof s.records!=='object')throw 0;
    if(!confirm('今のデータを読み込んだデータで置き換えますか？'))return;
    data=Object.assign({records:{},chief:'',questions:'',lastVisit:'',share:{},theme:'dark'},s);applyTheme();persist();loadDraft();toast('読み込みました');render()}
    catch(e){toast('読み込めないファイルです')}};
  r.readAsText(f);
}
function wipe(){if(!confirm('すべての記録を削除します。元に戻せません。よろしいですか？'))return;
  data={records:{},chief:'',questions:'',lastVisit:'',share:{},theme:data.theme||'dark'};persist();loadDraft();toast('削除しました');render()}

render();
</script>
</body>
</html>
