<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111615">
<title>診察メモAI</title>
<style>
:root{
  --bg:#111615;--sf:#1B2220;--sub:#242E2B;--tx:#FFFFFF;--mu:#E6ECEA;--bd:#3E4F49;
  --pr:#2DD4BF;--pr-tx:#0B221F;--pl:#1B3B36;--dg:#FFB4B4;--dgb:#3A1F1F;--dgd:#8A4A4A;
  --chk-bg:#FFFFFF;--chk-bd:#CBD5D1;--chk-on:#38BDF8;--chk-tx:#FFFFFF;
  --nav-tx:#E6ECEA;--warn-bg:#2E2614;--warn-bd:#B48A2E;--warn-tx:#FDE68A;
}
:root[data-theme="light"]{
  --bg:#F4F7F6;--sf:#FFFFFF;--sub:#EEF2F1;--tx:#111827;--mu:#1F2937;--bd:#CBD5D1;
  --pr:#0F5C55;--pr-tx:#FFFFFF;--pl:#E6F3F1;--dg:#7F1D1D;--dgb:#FFF5F5;--dgd:#E5989B;
  --chk-bg:#FFFFFF;--chk-bd:#94A3B8;--chk-on:#0EA5E9;--chk-tx:#FFFFFF;
  --nav-tx:#374151;--warn-bg:#FEF9C3;--warn-bd:#D97706;--warn-tx:#92400E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--sf)}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:20px;letter-spacing:.02em}
.tab-badge{font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pl);color:var(--pr)}
header p{margin:4px 0 0;font-size:15px;color:var(--mu)}
main{flex:1;padding:14px 14px 100px;display:flex;flex-direction:column;gap:12px}
main.has-action{padding-bottom:164px}
.lead-line{margin:0;font-size:15px;font-weight:600;color:var(--tx);background:var(--pl);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;line-height:1.45}
.flow-line{margin:0;font-size:14px;font-weight:700;color:var(--tx);background:var(--pl);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.sub{background:var(--sub);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
h2{margin:0;font-size:18px}
.mu{margin:0;font-size:15px;color:var(--mu);line-height:1.55}
.scale-guide{margin:0;font-size:11px;color:var(--mu);line-height:1.5;text-align:center}
.btn{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.on,.btn.pri{background:var(--pr);border-color:var(--pr);color:var(--pr-tx)}
.btn.del{color:var(--dg);border-color:var(--dgd)}
.btn.del-sm{min-height:34px;padding:4px 10px;font-size:13px;border-radius:9px;flex:0 0 auto}
.btn.edit-btn{min-height:40px;padding:6px 14px;font-size:15px;flex:0 0 auto}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.hist-hd{display:flex;align-items:center;gap:8px}
.hist-date{flex:1;font-size:17px}
input,select,textarea{width:100%;max-width:100%;min-width:0;min-height:44px;padding:10px;font:16px inherit;font-family:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:block}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.65}
textarea{min-height:90px}
.date-wrap{position:relative;width:100%;max-width:100%}
.date-wrap input[type="date"]{width:100%;max-width:100%;min-width:0;padding-right:40px;appearance:none;-webkit-appearance:none}
.date-wrap input[type="date"]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;top:0;width:44px;height:100%;cursor:pointer;z-index:2}
.date-ph{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);opacity:.6;pointer-events:none;font-size:16px}
.date-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mu);display:flex;align-items:center}
.chk-item{flex-direction:row;align-items:center;gap:12px;cursor:pointer}
.chk-box{appearance:none;-webkit-appearance:none;width:26px;min-width:26px;height:26px;min-height:26px;margin:0;padding:0;border-radius:7px;border:2px solid var(--chk-bd);background:var(--chk-bg);position:relative;cursor:pointer;flex:0 0 26px}
.chk-box:checked{background:var(--chk-on);border-color:var(--chk-on)}
.chk-box:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--chk-tx);font-size:17px;font-weight:800;line-height:1}
.rep-big{background:var(--sub);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rep-big-label{font-size:14px;font-weight:700;color:var(--pr)}
.rep-big-val{font-size:18px;font-weight:700;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.avg-box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.avg-name{font-size:13px;color:var(--mu);margin-bottom:4px;line-height:1.3}
.avg-num{font-size:22px;font-weight:800;color:var(--tx)}
.sticky-action{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:8;display:flex;justify-content:center;padding:8px 14px;background:var(--bg);border-top:1px solid var(--bd)}
.sticky-action button{width:100%;max-width:492px;min-height:52px;font-size:18px;font-weight:800;border-radius:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px;padding:4px}
nav button{min-height:48px;border:0;background:none;color:var(--nav-tx);font:600 15px inherit;font-family:inherit;border-radius:10px;cursor:pointer}
nav button.on{background:var(--pl);color:var(--pr);font-weight:800}
.danger{background:var(--dgb);border:2px solid var(--dgd);border-radius:14px;padding:14px;color:var(--tx);display:flex;flex-direction:column;gap:10px}
pre{white-space:pre-wrap;word-break:break-word;font:15px/1.7 inherit;font-family:inherit;margin:0}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#0F172A;color:#FFFFFF;border:1px solid #475569;padding:10px 18px;border-radius:99px;font-size:16px;font-weight:700;z-index:30;white-space:nowrap}
.hidden{display:none !important}

/* 連絡先（見やすいカード＋大きな電話番号ボタン） */
.contact-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.contact-item{background:var(--sub);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.contact-item.urgent{background:var(--dgb);border-color:var(--dgd)}
.contact-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.contact-name{font-size:16px;font-weight:800;color:var(--tx)}
.contact-sub{font-size:13px;color:var(--mu)}
.tel-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 14px;border-radius:10px;background:#22D3EE;color:#042F2E;font-size:21px;font-weight:800;letter-spacing:.05em;text-decoration:none;font-variant-numeric:tabular-nums;box-shadow:0 0 12px rgba(34,211,238,.35)}
.contact-item.urgent .tel-btn{background:#FF4D4F;color:#FFFFFF;box-shadow:0 0 12px rgba(255,77,79,.35)}
:root[data-theme="light"] .tel-btn{background:var(--pr);color:var(--pr-tx);box-shadow:none}
:root[data-theme="light"] .contact-item.urgent .tel-btn{background:#DC2626;color:#FFFFFF;box-shadow:none}
.preset-row{display:flex;flex-wrap:wrap;gap:6px}
.btn.preset{min-height:34px;padding:4px 10px;font-size:13px;border-radius:99px}
.rem-pill{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;border-radius:10px;background:var(--sub);border:1px solid var(--bd);font-size:13px;color:var(--mu);cursor:pointer}

/* 薬のチェック表 */
.med-add-row{display:flex;gap:8px;align-items:center}
.med-add-row input{flex:1}
.med-add-row button{flex:0 0 auto;white-space:nowrap}
.med-chip-row{display:flex;flex-wrap:wrap;gap:6px}
.med-chip{display:inline-flex;align-items:center;gap:6px;background:var(--sub);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;font-size:14px;font-weight:600}
.med-chip button{border:0;background:none;color:var(--dg);font-size:16px;font-weight:800;cursor:pointer;padding:0 2px;line-height:1}
.med-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:12px}
.med-table{width:100%;border-collapse:collapse;font-size:14px;min-width:340px}
.med-table th,.med-table td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:8px 4px;text-align:center}
.med-table th:last-child,.med-table td:last-child{border-right:0}
.med-table tr:last-child td{border-bottom:0}
.med-table th{background:var(--sub);font-weight:700;font-size:12px;color:var(--mu)}
.med-table td.med-name-cell{text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap;background:var(--sf)}
.med-cell-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--sub);color:var(--mu);font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.med-cell-btn.done{background:var(--chk-on);border-color:var(--chk-on);color:#FFFFFF}

/* リマインドバナー・設定 */
.rem-banner{background:var(--warn-bg);border:2px solid var(--warn-bd);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;color:var(--tx)}
.rem-banner-title{font-size:16px;font-weight:800;color:var(--warn-tx);display:flex;align-items:center;gap:6px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sub);padding:10px 12px;border-radius:12px}
.switch-row label{font-weight:700;font-size:15px;cursor:pointer;flex:1}
.switch-input{width:26px !important;min-width:26px !important;height:26px !important;min-height:26px !important;flex:0 0 26px !important}

/* アプリ内確認モーダル */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.modal-box p{margin:0;font-size:16px;line-height:1.55}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hd-top"><h1>診察メモAI</h1><span id="ht" class="tab-badge">記録</span></div>
  <p>診断の代わりではありません。記録だけのアプリです。</p>
</header>
<main id="main"></main>
</div>
<div id="sticky-wrap" class="sticky-action hidden"></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <p id="modal-msg"></p>
    <div class="row">
      <button class="btn" id="modal-cancel" onclick="closeModal(false)">キャンセル</button>
      <button class="btn pri" id="modal-ok" onclick="closeModal(true)">OK</button>
    </div>
  </div>
</div>
<nav><div id="nav"></div></nav>
<script>
const KEY='shinsatsu-memo-v2';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fmt=s=>{const p=s.split('-');return `${+p[1]}/${+p[2]}`};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num=v=>typeof v==='number'&&isFinite(v);
const today=()=>ymd(new Date());
const nowHHMM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};

const DEFAULT_DATA=()=>({
  records:{},
  chief:'',
  questions:'',
  lastVisit:'',
  share:{},
  theme:'dark',
  medList:['朝の薬','夜の薬'],
  reminder:{enabled:false,time:'21:00',medEnabled:false,medTime:'08:00',dismissedDate:''}
});

let data=DEFAULT_DATA();
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s){
    data=Object.assign(DEFAULT_DATA(),s);
    if(!Array.isArray(data.medList))data.medList=['朝の薬','夜の薬'];
    data.reminder=Object.assign({enabled:false,time:'21:00',medEnabled:false,medTime:'08:00',dismissedDate:''},s.reminder||{});
  }
}catch(e){}

function applyTheme(){
  const t=data.theme==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',t==='light'?'#0F5C55':'#111615');
}
applyTheme();

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(data))}
  catch(e){toast('保存できませんでした（プライベートモードの可能性）')}
}

const FIELDS=[['distress','全体的なつらさ'],['anxiety','不安の強さ'],['mood','気分の落ち込み'],['stomach','胃の不快感']];
const blank=()=>({distress:null,anxiety:null,mood:null,stomach:null,loop:null,sleep:null,med:null,medChecks:{},note:''});
let tab='rec',cur=today(),draft=blank(),crisis=false,repDetail=false,modalCb=null,lastNotifiedKey='';
loadDraft();

function loadDraft(){
  const rec=data.records[cur]||{};
  draft=Object.assign(blank(),rec);
  draft.medChecks=Object.assign({},rec.medChecks||{});
}
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.classList.remove('hidden');
  clearTimeout(window._t);
  window._t=setTimeout(()=>t.classList.add('hidden'),2500);
}
function openModal(msg,okLabel,isDanger,cb){
  modalCb=cb;
  document.getElementById('modal-msg').textContent=msg;
  const okBtn=document.getElementById('modal-ok');
  okBtn.textContent=okLabel||'OK';
  okBtn.className=isDanger?'btn del':'btn pri';
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(res){
  document.getElementById('modal').classList.add('hidden');
  const cb=modalCb;
  modalCb=null;
  if(res&&cb)cb();
}
function go(t){tab=t;render();window.scrollTo(0,0)}

function reminderBannerHtml(){
  const t=today();
  if(data.reminder.dismissedDate===t)return '';
  const hhmm=nowHHMM();
  const needRec=data.reminder.enabled&&data.reminder.time&&hhmm>=data.reminder.time&&!data.records[t];
  const todayRec=data.records[t];
  const hasAnyMedCheck=todayRec&&todayRec.medChecks&&Object.values(todayRec.medChecks).some(Boolean);
  const needMed=data.reminder.medEnabled&&data.reminder.medTime&&hhmm>=data.reminder.medTime&&data.medList.length>0&&!hasAnyMedCheck;
  if(!needRec&&!needMed)return '';
  const msgs=[];
  if(needRec)msgs.push(`体調の記録（${data.reminder.time}〜）がまだです`);
  if(needMed)msgs.push(`お薬のチェック（${data.reminder.medTime}〜）がまだです`);
  return `
  <section class="rem-banner" role="status">
    <div class="rem-banner-title">リマインドのお知らせ</div>
    <p style="margin:0;font-size:15px">${msgs.join(' ／ ')}</p>
    <div class="row">
      ${tab!=='rec'?`<button class="btn pri" onclick="go('rec')">記録・お薬チェックへ</button>`:''}
      <button class="btn" onclick="dismissReminder()">今日は閉じる</button>
    </div>
  </section>`;
}
function dismissReminder(){
  data.reminder.dismissedDate=today();
  persist();
  render();
}

function render(){
  const titles={rec:'記録する',hist:'履歴',rep:'診察前レポート',set:'設定'};
  document.getElementById('ht').textContent=titles[tab];
  document.getElementById('nav').innerHTML=[['rec','記録'],['hist','履歴'],['rep','レポート'],['set','設定']]
    .map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const mainEl=document.getElementById('main');
  const stickyEl=document.getElementById('sticky-wrap');
  const bodyHtml={rec:vRec,hist:vHist,rep:vRep,set:vSet}[tab]();
  mainEl.innerHTML=reminderBannerHtml()+bodyHtml;
  if(tab==='rec'){
    mainEl.classList.add('has-action');
    stickyEl.classList.remove('hidden');
    stickyEl.innerHTML=`<button class="btn pri" onclick="saveRec()">保存する</button>`;
  }else if(tab==='rep'){
    mainEl.classList.add('has-action');
    stickyEl.classList.remove('hidden');
    stickyEl.innerHTML=`<button class="btn pri" onclick="copyRep()">今すぐコピー</button>`;
  }else{
    mainEl.classList.remove('has-action');
    stickyEl.classList.add('hidden');
    stickyEl.innerHTML='';
  }
}

/* ---------- 記録 ---------- */
function vRec(){
  const exists=!!data.records[cur];
  const medItems=data.medList.map((m,i)=>`
    <label class="sub chk-item">
      <input type="checkbox" class="chk-box" ${draft.medChecks[m]?'checked':''} onchange="toggleDraftMed(${i},this.checked)">
      <span style="font-weight:700;font-size:16px">${esc(m)}</span>
    </label>`).join('');
  return `
  <p class="lead-line">今日の体調を記録して、診察で先生に見せるメモを作ります</p>
  <button class="rem-pill" onclick="go('set')">
    <span>リマインド：${data.reminder.enabled||data.reminder.medEnabled?[data.reminder.enabled?'記録 '+data.reminder.time:'',data.reminder.medEnabled?'服薬 '+data.reminder.medTime:''].filter(Boolean).join(' ／ '):'未設定'}</span>
    <span style="color:var(--pr);font-weight:700">設定へ ›</span>
  </button>
  ${crisis?crisisBox():''}
  <section class="card">
    <label class="mu" for="d">記録する日</label>
    <div class="date-wrap">
      <input id="d" type="date" max="${today()}" value="${cur}" onchange="changeDate(this.value)">
      <span class="date-ico" aria-hidden="true">${calSvg()}</span>
    </div>
    <p class="mu">${exists?'この日は記録済みです（上書き保存されます）':'この日はまだ記録がありません'}。書ける項目だけで大丈夫です。未選択は「未入力」として扱われ、0（なし）とは区別されます。</p>
    ${FIELDS.map(([k,l])=>`
      <div class="sub">
        <div class="row"><b>${l}</b><span class="mu" style="text-align:right">${num(draft[k])?draft[k]+' / 4':'未入力'}</span></div>
        <div class="g5">${[0,1,2,3,4].map(n=>`<button class="btn ${draft[k]===n?'on':''}" onclick="setScale('${k}',${n})">${n}</button>`).join('')}</div>
        <p class="scale-guide">0 なし ／ 1 少し ／ 2 まあまあ<br>3 つらい ／ 4 とてもつらい</p>
      </div>`).join('')}
    <p class="mu">もう一度同じ数字を押すと「未入力」に戻ります。</p>
    <label class="mu" for="lp">思考ループ（同じ考えが頭を回る）</label>
    <select id="lp" onchange="draft.loop=this.value===''?null:this.value==='1'">
      <option value="" ${draft.loop===null?'selected':''}>未入力</option>
      <option value="1" ${draft.loop===true?'selected':''}>あり</option>
      <option value="0" ${draft.loop===false?'selected':''}>なし</option></select>
    <label class="mu" for="sl">睡眠時間（時間）</label>
    <input id="sl" type="number" inputmode="decimal" step="0.5" min="0" max="24" placeholder="例：6.5" value="${num(draft.sleep)?draft.sleep:''}" oninput="const v=parseFloat(this.value);draft.sleep=isNaN(v)?null:v">
    <div class="sub">
      <div class="row"><b>お薬のチェック表（飲めた薬にチェック）</b><span class="mu" style="text-align:right">${data.medList.filter(m=>draft.medChecks[m]).length} / ${data.medList.length}</span></div>
      ${data.medList.length?medItems:`<p class="mu">登録されたお薬がありません。下の欄や設定から追加できます。</p>`}
      <div class="med-add-row">

/* ---------- レポート ---------- */
function period(){
  const t=today();let from=addDays(t,-13);
  if(data.lastVisit&&data.lastVisit<t&&diff(data.lastVisit,t)<=180)from=addDays(data.lastVisit,1);
  return {from,to:t,n:diff(from,t)+1};
}
function stat(list,k){const v=list.map(r=>r[k]).filter(num);if(!v.length)return{avg:null,n:0,min:null,max:null};
  const s=v.reduce((a,b)=>a+b,0);return{avg:+(s/v.length).toFixed(1),n:v.length,min:Math.min(...v),max:Math.max(...v)}}
function reportText(){
  const p=period();
  const recs=Object.keys(data.records).filter(d=>d>=p.from&&d<=p.to).sort().map(d=>Object.assign({d},data.records[d]));
  const line=(l,s,u,mx)=>s.n?`・${l}：平均 ${s.avg}${u}${mx?'/4':''}（${s.n}日分、範囲 ${s.min}〜${s.max}）`:`・${l}：記録なし`;
  const mid=addDays(p.from,Math.floor(p.n/2));
  const h1=recs.filter(r=>r.d<mid),h2=recs.filter(r=>r.d>=mid);
  const half=k=>{const a=stat(h1,k),b=stat(h2,k);
    return `${a.n?a.avg+'（'+a.n+'日分）':'記録なし'} → ${b.n?b.avg+'（'+b.n+'日分）':'記録なし'}`};
  const loopA=recs.filter(r=>typeof r.loop==='boolean'),loopY=loopA.filter(r=>r.loop);
  const medA=recs.filter(r=>r.med),taken=medA.filter(r=>r.med==='飲めた'),missed=medA.filter(r=>r.med==='飲み忘れた');
  const medCheckLines=data.medList.map(m=>{
    const cnt=recs.filter(r=>r.medChecks&&r.medChecks[m]).length;
    return `・${m}：チェック ${cnt}日 / 期間${p.n}日`;
  });
  const none=[];
  FIELDS.forEach(([k,l])=>{if(!stat(recs,k).n)none.push(l)});
  if(!stat(recs,'sleep').n)none.push('睡眠時間');if(!loopA.length)none.push('思考ループ');if(!medA.length)none.push('服薬');
  const notes=recs.filter(r=>r.note&&data.share[r.d]);
  return [
`【診察前メモ】${fmt(p.from)}〜${fmt(p.to)}（${p.n}日間・記録${recs.length}日／未記録${p.n-recs.length}日）`,
`※本人の記録を未入力除外で集計。診断や薬の効果の判断ではありません。`,
``,`■今回一番伝えたいこと`,data.chief.trim()||'（未記入）',
``,`■症状の平均（0〜4）`,...FIELDS.map(([k,l])=>line(l,stat(recs,k),'',true)),
`・前半→後半の不安（${fmt(p.from)}〜${fmt(addDays(mid,-1))} → ${fmt(mid)}〜${fmt(p.to)}）：${half('anxiety')}`,
`・思考ループ：${loopA.length?`「あり」${loopY.length}日（回答${loopA.length}日分）`:'記録なし'}`,
``,`■睡眠`,line('睡眠時間',stat(recs,'sleep'),'時間'),`・前半→後半：${half('sleep')}`,
``,`■服薬`,medA.length?`・飲めた${taken.length}日／飲み忘れ${missed.length}日（回答${medA.length}日分）`:'・記録なし',
...(missed.length?[`・飲み忘れ日：${missed.map(r=>fmt(r.d)).join('、')}`]:[]),
...medCheckLines,
``,`■本人メモ（共有を選んだもの）`,...(notes.length?notes.map(r=>`・${fmt(r.d)}「${r.note}」`):['・なし']),
``,`■医師に質問したいこと`,data.questions.trim()||'（未記入）',
``,`■期間中に記録がなかった項目`,none.length?none.join('、'):'なし'
  ].join('\n');
}

  const t=today().replace(/-/g,'');
  const events=[];
  const mkEv=(uid,hhmm,summary)=>{
    const [hh,mm]=hhmm.split(':');
    return [
      'BEGIN:VEVENT',
      `UID:${uid}@shinsatsu-memo`,
      `DTSTART:${t}T${hh}${mm}00`,
      `DURATION:PT10M`,
      'RRULE:FREQ=DAILY',
      `SUMMARY:${summary}`,
      'BEGIN:VALARM',
      'TRIGGER:PT0M',
      'ACTION:DISPLAY',
      `DESCRIPTION:${summary}`,
      'END:VALARM',
      'END:VEVENT'
    ].join('\r\n');
  };
  if(data.reminder.enabled&&data.reminder.time)events.push(mkEv('rec',data.reminder.time,'診察メモAI：今日の体調を記録'));
  if(data.reminder.medEnabled&&data.reminder.medTime)events.push(mkEv('med',data.reminder.medTime,'診察メモAI：お薬のチェック'));
  if(!events.length)events.push(mkEv('rec',data.reminder.time||'21:00','診察メモAI：今日の体調を記録'));
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ShinsatsuMemoAI//JP',...events,'END:VCALENDAR'].join('\r\n');
  const b=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='shinsatsu-memo-reminder.ics';
  a.click();
  toast('カレンダーファイルを書き出しました');
}
function setTheme(t){
  data.theme=t;
  applyTheme();
  persist();
  render();
  toast(t==='light'?'明るい画面にしました':'暗い画面にしました');
}
function exportData(){
  const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`shinsatsu-memo-${today()}.json`;a.click();
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||typeof s.records!=='object')throw 0;
    openModal('今のデータを読み込んだデータで置き換えますか？','置き換える',false,()=>{
      data=Object.assign(DEFAULT_DATA(),s);
      if(!Array.isArray(data.medList))data.medList=['朝の薬','夜の薬'];
      data.reminder=Object.assign({enabled:false,time:'21:00',medEnabled:false,medTime:'08:00',dismissedDate:''},s.reminder||{});
      applyTheme();persist();loadDraft();toast('読み込みました');render();
    });
  }catch(e){toast('読み込めないファイルです')}};
  r.readAsText(f);
}
function wipe(){
  openModal('すべての記録を削除します。元に戻せません。よろしいですか？','すべて削除',true,()=>{
    const keepTheme=data.theme||'dark';
    data=DEFAULT_DATA();
    data.theme=keepTheme;
    persist();loadDraft();toast('削除しました');render();
  });
}

function checkReminderTick(){
  const t=today(),hm=nowHHMM();
  const key=`${t}_${hm}`;
  if(lastNotifiedKey===key)return;
  const hitRec=data.reminder.enabled&&data.reminder.time===hm&&!data.records[t];
  const todayRec=data.records[t];
  const hasMed=todayRec&&todayRec.medChecks&&Object.values(todayRec.medChecks).some(Boolean);
  const hitMed=data.reminder.medEnabled&&data.reminder.medTime===hm&&!hasMed;
  if(hitRec||hitMed){
    lastNotifiedKey=key;
    const msg=hitRec?'今日の体調を記録する時間です':'お薬をチェックする時間です';
    toast(msg);
    render();
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
      try{new Notification('診察メモAI',{body:msg})}catch(e){}
    }
  }
}
if(window._remTimer)clearInterval(window._remTimer);
window._remTimer=setInterval(checkReminderTick,30000);

render();
</script>
</body>
</html>
